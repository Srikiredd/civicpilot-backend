spring.application.name=civicpilot-backend
server.port=8080

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/civicpilot}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-message=always

# ==========================================
# CIVICPILOT EMAIL CONFIGURATION
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
civicpilot.mail.from=${MAIL_FROM}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ==========================================
# CIVICPILOT AI - GEMINI CHAT CONFIGURATION
# ==========================================

spring.ai.google.genai.api-key=${GCP_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.0
spring.ai.google.genai.chat.tool-choice.mode=AUTO

# ==========================================
# CIVICPILOT AI - GEMINI EMBEDDINGS
# ==========================================

spring.ai.google.genai.embedding.api-key=${GCP_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT

# ==========================================
# GEMINI AI IMAGE GENERATION
# ==========================================

spring.ai.model.image=google-genai
spring.ai.google.genai.image.api-key=${GCP_API_KEY}
spring.ai.google.genai.image.model=gemini-2.5-flash-image
spring.ai.google.genai.image.n=1
spring.ai.google.genai.image.aspect-ratio=16:9
spring.ai.google.genai.image.output-mime-type=image/png

# ==========================================
# FILE UPLOAD CONFIGURATION
# ==========================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# TWILIO SMS CONFIGURATION
# ==========================================

twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}